# CI（#28）：零网络回归门。
#
# - suites：全量回归——root + review-pi 两包 typecheck + 测试（root 只剩呈现层
#   翻译投影 / 分组映射 / 引擎装配的测试）。
# - DSH 内核（packages/review-dsh）已随「从 0 基于 pi 内核」方向移除（ADR-0009）。
# - review-pi（#3 起的 pi 内核线 Review Runtime）进 suites：typecheck 走包内
#   tsconfig（内核四包按 npm 依赖消费上游 dist 的 .d.ts，ADR-0035），测试经
#   vitest source 条件按 TS 源解析——两步均不依赖仓内内核产物。dist 构建显式
#   执行（pnpm --filter @baize/review-pi build）。#7 起 dist 前置构建进 CI：
#   进程级烟测（src/cli/bin.process.test.ts）spawn 真 bin（bin/review-pi.js →
#   dist/cli/main.js），在位检查 + mtime 判鲜门要求全部运行时产物腿在位且新鲜
#   （测试内自愈构建兜底同源判鲜，正常路径 CI 先建好即 no-op）。
#   注意：真跑全链验收 skipIf 守卫 gitignored 本机数据（数据集快照 / runs 记录），
#   CI 上自动跳过——CI 绿不等于真跑验收通过，全量证明以本地实跑为准。
# - P2 字节纪律门（#5，review-pi test:gate）随 ADR-0024 删除：配置矩阵与
#   对照真源（A/B 请求体 vs DSH 审计）不再存在于本仓。
# - 真实 API 的指标对齐门（#29）随评测仪器层一并删除，不进 CI。
# - 离线回放门（ADR-0048）：`pnpm test:replay` 用冻结 trace 起本地回放服务，
#   不调真实模型，逐个场景跑一次完整检视。并发阶梯（ramp）只在本地/nightly，
#   不作性能门禁。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    name: suites (全量回归)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本单源：root package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist 前置构建（#7/#8）：本包 CLI 产物（内核四包由 pnpm install 落位）。
      # #7：进程级烟测 spawn 真 bin（在位检查 + mtime 判鲜门要求产物新鲜）；
      # #8：root typecheck 经根 tsconfig paths 消费 review-pi dist d.ts
      # （类型链），dist 必须先于 Typecheck (root) 在位。
      - name: Build dist (review-pi)
        run: |
          pnpm --filter @baize/review-pi build

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (review-pi)
        run: pnpm --filter @baize/review-pi typecheck

      - name: Test (review-pi)
        run: pnpm --filter @baize/review-pi test

      - name: Test (root)
        run: pnpm test

  replay:
    name: replay (离线回放)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 回放 spawn 真 bin（bin/review-pi.js → dist/cli/main.js），在位检查 +
      # mtime 判鲜门要求产物先建好。
      - name: Build dist (review-pi)
        run: pnpm --filter @baize/review-pi build

      # 零网络：回放服务只监听 127.0.0.1；全场景 trace 已随仓库提交。
      - name: Offline replay suites
        run: pnpm test:replay
